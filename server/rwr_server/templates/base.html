<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="same-origin">
<title>{% block title %}RWR server{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
{% if csrf is defined and not public %}
<header>
  <a class="brand" href="/">RWR server</a>
  <nav>
    <a href="/">Dashboard</a>
    <a href="/devices">Devices</a>
    <a href="/events">Events</a>
    <a href="/live">Live</a>
    <a href="/settings">Settings</a>
    <a href="/account">Account</a>
    <form method="post" action="/logout" class="inline">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <button class="link">Sign out</button>
    </form>
  </nav>
</header>
{% endif %}
<main>
{% if flash %}<p class="flash ok">{{ flash }}</p>{% endif %}
{% if error %}<p class="flash err">{{ error }}</p>{% endif %}
{% block content %}{% endblock %}
</main>
</body>
</html>
