{% extends "base.html" %}
{% block content %}
<section class="card narrow center">
  <h1>Scan with the RWR app</h1>
  <img class="qr" src="{{ qr }}" alt="Pairing QR code">
  <p>Valid for {{ minutes }} minutes, works once. The phone will connect to <code>{{ base }}</code>.</p>
  <details><summary>Can't scan? Copy the pairing link</summary>
    <textarea readonly rows="4">{{ link }}</textarea>
    <p class="muted small">Treat this link like a password until it is used or expires.</p>
  </details>
  <p><a href="/devices">Done</a></p>
</section>
{% endblock %}
